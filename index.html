<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>נסיעות קצרות – מעקב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F4F2;
    --surface: #FFFFFF;
    --ink: #1B2A26;
    --muted: #5E6F6A;
    --line: #D3DCD8;
    --accent: #23675A;
    --ok: #1E8449;   --ok-bg: #E1F2E7;
    --wait: #7A8784; --wait-bg: #EEF1F0;
    --work: #B9770E; --work-bg: #FBEFD9;
    --no: #C0392B;   --no-bg: #FAE3E0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101816; --surface: #18231F; --ink: #E5EEEB; --muted: #9CB0AA; --line: #2C3B36;
      --accent: #5FC0AA;
      --ok: #52C27F; --ok-bg: #173226;
      --wait: #9CB0AA; --wait-bg: #22302C;
      --work: #E8B04E; --work-bg: #392D15;
      --no: #EE6E60; --no-bg: #3B1E1B;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Assistant", "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.55; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 18px 64px; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--work); outline-offset: 3px; }

  .site-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; color: var(--muted); font-size: .95rem; }
  .site-head strong { color: var(--ink); font-size: 1.05rem; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .tabs button {
    font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 7px 16px; border-radius: 999px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .trip-head { margin-bottom: 22px; }
  .trip-head h1 { font-family: "Secular One", "Assistant", sans-serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1; margin: 0 0 8px; }
  .dates { font-size: 1.1rem; font-weight: 600; }
  .dates .soon { color: var(--accent); margin-inline-start: 10px; }

  /* מסלול האישורים – 11 מקטעים, כל אחד בצבע הסטטוס */
  .track { display: flex; gap: 4px; margin-top: 18px; }
  .track span { flex: 1; height: 8px; border-radius: 2px; background: var(--sc); }
  .track-label { margin-top: 6px; color: var(--muted); font-size: .95rem; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .panel + .panel { margin-top: 20px; }
  .panel h2 { font-size: 1.15rem; margin: 0 0 12px; font-weight: 700; }

  .people { list-style: none; margin: 0; padding: 0; }
  .people li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .people li:last-child { border-bottom: 0; }
  .pill { font-size: .85rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; color: var(--sc); background: var(--sbg); white-space: nowrap; }
  .btn {
    display: inline-block; margin-top: 14px; background: var(--accent); color: var(--bg); text-decoration: none;
    font-weight: 700; padding: 10px 18px; border-radius: 10px;
  }
  .note { color: var(--muted); font-size: .88rem; margin: 8px 0 0; }

  .empty { color: var(--muted); }

  .steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .steps li {
    counter-increment: s; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line); position: relative;
  }
  .steps li:last-child { border-bottom: 0; }
  .steps li::before {
    content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: .85rem; font-weight: 700; background: var(--sbg); color: var(--sc); border: 2px solid var(--sc);
  }
  .steps .role { font-weight: 600; }
  .steps .dt { display: block; color: var(--muted); font-size: .85rem; font-weight: 400; }
  .steps li.current .role::after { content: "  ← כאן עכשיו"; color: var(--accent); font-weight: 700; font-size: .85rem; }

  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .box {
    flex: none; width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--wait);
    display: grid; place-items: center; font-weight: 700; font-size: .9rem; line-height: 1;
  }
  .yes .box { background: var(--ok); border-color: var(--ok); color: #fff; }
  .yes .label { color: var(--ink); }
  .checks .label { flex: 1; }
  .checks .tag { color: var(--muted); font-size: .85rem; }
  .yes .tag { color: var(--ok); font-weight: 600; }
  .count { color: var(--muted); font-weight: 400; font-size: .95rem; }

  .meta { color: var(--muted); margin-top: 4px; }
  .notes { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .notes b { display: block; font-size: .85rem; color: var(--muted); font-weight: 600; }
  .alert { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 700; background: var(--no-bg); color: var(--no); border: 1px solid var(--no); }

  .sum-title { font-family: "Secular One", "Assistant", sans-serif; font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 16px; }
  .sum-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .sum-card {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; width: 100%; text-align: start;
    font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; cursor: pointer;
  }
  .sum-card:hover { border-color: var(--accent); }
  .sum-card.urgent { border-color: var(--no); border-inline-start-width: 5px; }
  .sum-card h3 { margin: 0; font-size: 1.2rem; }
  .sum-card .when { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .sum-card.urgent .when { color: var(--no); }
  .sum-card .facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: .95rem; }
  .sum-card .facts b { color: var(--ink); }
  .sum-card .track { grid-column: 1 / -1; margin-top: 4px; }
  .sum-card .warn { grid-column: 1 / -1; color: var(--no); font-weight: 700; font-size: .95rem; }

  .banner { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-weight: 700; background: var(--sbg); color: var(--sc); }
</style>
</head>
<body>
<div class="wrap">
  <div class="site-head">
    <strong>נסיעות קצרות – מעקב</strong>
    <span id="updated"></span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  <main id="trip"></main>
</div>

<script>
  const COLORS = {
    "אושר": ["--ok", "--ok-bg"], "התקבל": ["--ok", "--ok-bg"],
    "בטיפול": ["--work", "--work-bg"],
    "נדחה": ["--no", "--no-bg"], "חסר": ["--no", "--no-bg"],
    "ממתין": ["--wait", "--wait-bg"]
  };
  const vars = s => { const c = COLORS[s] || COLORS["ממתין"]; return `--sc:var(${c[0]});--sbg:var(${c[1]})`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
  const parse = d => { if (!d) return null; const [y, m, dd] = d.split("-").map(Number); return y ? new Date(y, m - 1, dd) : null; };
  const fmt = d => { const x = parse(d); return x ? x.toLocaleDateString("he-IL", { day: "numeric", month: "numeric", year: "numeric" }) : "—"; };
  const DAY = 86400000;

  function whenText(t) {
    const s = parse(t.start), e = parse(t.end);
    if (!s) return "";
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const d = Math.round((s - today) / DAY);
    if (d > 1) return `עוד ${d} ימים`;
    if (d === 1) return "יוצאים מחר";
    if (d === 0) return "יוצאים היום";
    if (e && today <= e) return "בנסיעה עכשיו";
    return "הנסיעה הסתיימה";
  }


  const isYes = v => v === "יש" || v === true;
  function checklist(items, emptyText) {
    if (!items.length) return `<p class="empty">${emptyText}</p>`;
    return `<ul class="checks">${items.map(x => `
      <li class="${x.yes ? "yes" : ""}">
        <span class="box" aria-hidden="true">${x.yes ? "✓" : ""}</span>
        <span class="label">${esc(x.label)}</span>
        <span class="tag">${x.yes ? x.yesText : x.noText}</span>
      </li>`).join("")}</ul>`;
  }

  const URGENT_DAYS = 14;   // כמה ימים לפני היציאה להתחיל להזהיר

  function daysLeft(t) {
    const st = parse(t.start); if (!st) return null;
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((st - today) / DAY);
  }
  function stats(t) {
    const steps = t.approvals || [], docs = t.documents || [], people = t.participants || [];
    const approved = steps.filter(s => s.status === "אושר").length;
    const docsReady = docs.filter(d => isYes(d.ready)).length;
    const visas = people.filter(p => isYes(p.visa)).length;
    const d = daysLeft(t);
    const missing = [];
    if (approved < steps.length) missing.push(`${steps.length - approved} אישורים`);
    if (docsReady < docs.length) missing.push(`${docs.length - docsReady} מסמכים`);
    const urgent = d !== null && d >= 0 && d <= URGENT_DAYS && missing.length > 0;
    return { steps, docs, people, approved, docsReady, visas, d, missing, urgent };
  }
  function warning(t, st) {
    if (!st.urgent) return "";
    const when = st.d === 0 ? "היציאה היום" : st.d === 1 ? "היציאה מחר" : `נשארו ${st.d} ימים ליציאה`;
    return `${when}, וחסרים עוד ${st.missing.join(" ו-")}`;
  }

  // סדר הנסיעות: הקרובה ביותר ראשונה, נסיעות שהסתיימו בסוף
  function tripOrder() {
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const isPast = t => { const e = parse(t.end) || parse(t.start); return e ? e < today : false; };
    return trips.map((t, i) => i).sort((a, b) => {
      const A = trips[a], B = trips[b], pa = isPast(A), pb = isPast(B);
      if (pa !== pb) return pa ? 1 : -1;
      const sa = A.start || "9999", sb = B.start || "9999";
      return pa ? sb.localeCompare(sa) : sa.localeCompare(sb);
    });
  }

  function showSummary() {
    const order = tripOrder();
    document.getElementById("trip").innerHTML = `
      <h1 class="sum-title">כל הנסיעות</h1>
      <ul class="sum-list">
        ${order.map(i => { const t = trips[i], st = stats(t); return `
          <li><button class="sum-card ${st.urgent ? "urgent" : ""}" data-i="${i}">
            <h3>${esc(t.name)}</h3>
            <span class="when">${whenText(t)}</span>
            <div class="facts">
              <span>${fmt(t.start)} – ${fmt(t.end)}</span>
              ${t.destination ? `<span>${esc(t.destination)}</span>` : ""}
              <span>אישורים: <b>${st.approved}/${st.steps.length}</b></span>
              <span>מסמכים: <b>${st.docsReady}/${st.docs.length}</b></span>
              <span>ויזות: <b>${st.visas}/${st.people.length}</b></span>
            </div>
            <div class="track" aria-hidden="true">${st.steps.map(s => `<span style="${vars(s.status)}"></span>`).join("")}</div>
            ${st.urgent ? `<div class="warn">⚠ ${warning(t, st)}</div>` : ""}
          </button></li>`; }).join("")}
      </ul>`;
    document.querySelectorAll(".sum-card").forEach(c => c.addEventListener("click", () => { show(+c.dataset.i); window.scrollTo(0, 0); }));
    setSelected(-1);
    document.title = "נסיעות קצרות – מעקב";
  }

  function setSelected(i) {
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", +b.dataset.i === i));
  }

  function show(i) {
    const t = trips[i];
    const steps = t.approvals || [];
    const approved = steps.filter(s => s.status === "אושר").length;
    const rejected = steps.some(s => s.status === "נדחה");
    const currentIdx = steps.findIndex(s => s.status !== "אושר");
    const people = t.participants || [];
    const docs = t.documents || [];

    let banner = "";
    if (rejected) banner = `<div class="banner" style="${vars("נדחה")}">יש אישור שנדחה</div>`;
    else if (steps.length && approved === steps.length) banner = `<div class="banner" style="${vars("אושר")}">כל האישורים התקבלו</div>`;

    document.getElementById("trip").innerHTML = `
      <header class="trip-head">
        <h1>${esc(t.name)}</h1>
        <div class="dates">${fmt(t.start)} – ${fmt(t.end)}<span class="soon">${whenText(t)}</span></div>
        ${t.destination ? `<div class="meta">יעד: ${esc(t.destination)}</div>` : ""}
        <div class="track" aria-hidden="true">${steps.map(s => `<span style="${vars(s.status)}"></span>`).join("")}</div>
        <div class="track-label">${approved} מתוך ${steps.length} אישורים התקבלו</div>
        ${banner}
        ${stats(t).urgent ? `<div class="alert">⚠ ${warning(t, stats(t))}</div>` : ""}
        ${t.notes ? `<div class="notes"><b>הערות</b>${esc(t.notes)}</div>` : ""}
      </header>

      <div class="grid">
        <div>
          <section class="panel">
            <h2>משתתפים <span class="count">(${people.length} · ויזה ל-${people.filter(p => isYes(p.visa)).length})</span></h2>
            ${checklist(people.map(p => ({ label: p.name, yes: isYes(p.visa), yesText: "יש ויזה", noText: "אין ויזה" })), "טרם נוספו משתתפים")}
            ${typeof PASSPORT_UPLOAD_LINK !== "undefined" && PASSPORT_UPLOAD_LINK ? `
              <a class="btn" href="${esc(PASSPORT_UPLOAD_LINK)}" target="_blank" rel="noopener">העלאת דרכון</a>
              <p class="note">הקובץ נשלח ישירות לאחראי ולא מוצג באתר. יש לכתוב את שם הנסיעה ואת שמך בזמן ההעלאה.</p>` : ""}
          </section>

          <section class="panel">
            <h2>מסמכים להכנה <span class="count">(${docs.filter(d => isYes(d.ready)).length} מתוך ${docs.length})</span></h2>
            ${checklist(docs.map(d => ({ label: d.name, yes: isYes(d.ready), yesText: "מוכן", noText: "חסר" })), "אין מסמכים ברשימה")}
          </section>

        </div>

        <section class="panel">
          <h2>אישורים</h2>
          <ol class="steps">
            ${steps.map((s, k) => `
              <li class="${k === currentIdx && !rejected ? "current" : ""}" style="${vars(s.status)}">
                <span class="role">${esc(s.role)}${s.date ? `<span class="dt">${fmt(s.date)}</span>` : ""}</span>
                <span class="pill">${esc(s.status || "ממתין")}</span>
              </li>`).join("")}
          </ol>
        </section>
      </div>`;

    setSelected(i);
    document.title = t.name + " – נסיעות קצרות";
  }

  let trips = null;
  let sourceNote = "";

  function init() {
  if (!trips) {
    document.getElementById("trip").innerHTML = `<div class="panel"><h2>האתר לא הצליח לקרוא את הנתונים</h2><p class="empty">כנראה יש טעות קטנה בקובץ data.js – למשל פסיק או מירכאה חסרים. בדקו את השינוי האחרון שנעשה בקובץ.</p></div>`;
    return;
  }
  document.getElementById("updated").textContent = sourceNote || ("עודכן: " + fmt(typeof LAST_UPDATED !== "undefined" ? LAST_UPDATED : ""));
  if (trips.length > 1) {
    const tabs = document.getElementById("tabs");
    tabs.hidden = false;
    tabs.innerHTML = `<button role="tab" data-i="-1">כל הנסיעות</button>` +
      tripOrder().map(i => { const t = trips[i]; return `<button role="tab" data-i="${i}">${stats(t).urgent ? "⚠ " : ""}${esc(t.name)}</button>`; }).join("");
    tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; +b.dataset.i < 0 ? showSummary() : show(+b.dataset.i); });
    showSummary();
  } else if (trips.length) show(tripOrder()[0]);
  else document.getElementById("trip").innerHTML = `<p class="empty">אין נסיעות עדיין. מוסיפים נסיעה בקובץ data.js.</p>`;
  }

  // ---------- קריאת הנתונים מגיליון Google Sheets ----------
  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let k = 0; k < text.length; k++) {
      const ch = text[k];
      if (q) {
        if (ch === '"') { if (text[k + 1] === '"') { cell += '"'; k++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[k + 1] === "\n") k++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function normDate(v) {
    v = (v || "").trim(); let m;
    if ((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    if ((m = v.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/))) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    return "";
  }
  function sheetToTrips(rows) {
    const head = (rows[0] || []).map(h => h.trim());
    const col = name => head.indexOf(name);
    const cName = col("שם הנסיעה"), cStart = col("תאריך יציאה"), cEnd = col("תאריך חזרה"),
          cDest = col("יעד"), cNotes = col("הערות"), cPeople = col("משתתפים");
    if (cName < 0) throw new Error("no header");
    const aCols = [], dCols = [];
    head.forEach((h, k) => {
      if (h.startsWith("אישור:")) aCols.push([k, h.slice(6).trim()]);
      if (h.startsWith("מסמך:")) dCols.push([k, h.slice(5).trim()]);
    });
    const get = (r, k) => (k >= 0 && r[k] != null ? String(r[k]).trim() : "");
    return rows.slice(1).filter(r => get(r, cName)).map(r => ({
      name: get(r, cName),
      start: normDate(get(r, cStart)),
      end: normDate(get(r, cEnd)),
      destination: get(r, cDest),
      notes: get(r, cNotes),
      participants: get(r, cPeople).split(/[\n,]+/).map(x => x.trim()).filter(Boolean).map(x => {
        const m = x.match(/^(.*?)\s*[-–:]\s*(יש|אין)\s*$/);
        return m ? { name: m[1].trim(), visa: m[2] } : { name: x, visa: "אין" };
      }),
      approvals: aCols.filter(([k]) => get(r, k) !== "-").map(([k, role]) => ({ role, status: get(r, k) || "ממתין", date: "" })),
      documents: dCols.filter(([k]) => get(r, k) !== "-").map(([k, name]) => ({ name, ready: get(r, k) || "אין" }))
    }));
  }
  function fromDataJs() {
    return typeof TRIPS !== "undefined" ? TRIPS : null;
  }

  async function loadData() {
    const url = typeof SHEET_CSV_URL !== "undefined" ? SHEET_CSV_URL.trim() : "";
    if (url) {
      try {
        const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        trips = sheetToTrips(parseCSV(await res.text()));
        sourceNote = "הנתונים נטענו מהגיליון";
      } catch (e) {
        trips = fromDataJs();
        sourceNote = trips ? "לא הצלחתי לקרוא את הגיליון – מוצגים הנתונים מ-data.js" : "";
      }
    } else {
      trips = fromDataJs();
    }
    init();
  }

  // טוען תמיד את הגרסה העדכנית של data.js (בלי זיכרון של הדפדפן)
  const dataScript = document.createElement("script");
  dataScript.src = "data.js?v=" + Date.now();
  dataScript.onload = loadData;
  dataScript.onerror = loadData;
  document.body.appendChild(dataScript);
</script>
</body>
