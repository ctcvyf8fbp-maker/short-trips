<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מאגר מסמכים – נסיעות בתפקיד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8; --card: #FFFFFF; --ink: #16181D; --muted: #707680; --line: #E4E6EA; --soft: #F1F2F4;
    --main: #0F6B5C; --main-soft: #E2F2EE; --hot: #C9302C; --hot-soft: #FDE8E6; --warn: #FBEFD9; --warn-ink: #6B4A00;
    --wa: #1F9D55;
    --shadow: 0 1px 2px rgba(22,24,29,.05), 0 6px 18px rgba(22,24,29,.05);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111416; --card: #1A1E21; --ink: #ECEEF0; --muted: #98A0A8; --line: #2B3136; --soft: #23282C;
      --main: #4FC3A9; --main-soft: #173A33; --hot: #F0675C; --hot-soft: #3E1F1C; --warn: #3A2E16; --warn-ink: #F2D59A;
      --shadow: none;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 "Assistant", "Segoe UI", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--main); outline-offset: 3px; border-radius: 6px; }
  a { color: var(--main); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 30px 18px 64px; }

  .site-head { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .site-head .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--main); display: grid; place-items: center; flex: none; }
  .site-head .logo svg { width: 26px; height: 26px; fill: var(--card); transform: rotate(-45deg); }
  .site-head h1 { margin: 0; font: 700 clamp(1.5rem, 4.6vw, 2rem)/1.15 "Rubik", "Assistant", sans-serif; }
  .site-head p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

  /* מאגר */
  .lib { display: grid; gap: 14px; }
  .doc-card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  .doc-card .icon { grid-row: span 2; width: 46px; height: 46px; border-radius: 12px; background: var(--main-soft); color: var(--main); display: grid; place-items: center; font-size: 1.4rem; }
  .doc-card h2 { margin: 0; font: 700 1.2rem/1.3 "Rubik", "Assistant", sans-serif; }
  .doc-card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .doc-card .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; padding: 8px 15px; font-weight: 700; font-size: .92rem; cursor: pointer; text-decoration: none; border: 1px solid transparent; }
  .btn.primary { background: var(--main); color: var(--card); }
  .btn.line { background: var(--card); border-color: var(--main); color: var(--main); }
  .btn.wa { background: var(--wa); color: #fff; }
  .btn.quiet { background: var(--soft); color: var(--ink); }
  .copied { color: var(--main); font-weight: 700; font-size: .88rem; align-self: center; }

  /* עמוד מסמך */
  .back { display: inline-block; margin-bottom: 14px; font-weight: 600; text-decoration: none; }
  .doc-head h2 { margin: 0 0 4px; font: 700 clamp(1.5rem, 4.6vw, 2rem)/1.2 "Rubik", "Assistant", sans-serif; }
  .doc-head p { margin: 0 0 14px; color: var(--muted); }
  .doc-head .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .panel { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .panel > h3 { margin: 0 0 12px; font: 700 1.1rem "Rubik", "Assistant", sans-serif; }
  .callout { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: .95rem; }
  .callout.warn { background: var(--warn); color: var(--warn-ink); }
  .callout.bad { background: var(--hot-soft); color: var(--hot); }
  .callout ul { margin: 6px 0 0; padding-inline-start: 20px; }
  details.fold { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; background: var(--card); }
  details.fold > summary { cursor: pointer; padding: 14px 16px; font-weight: 700; list-style: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: " ▾"; color: var(--muted); }
  details.fold[open] > summary::after { content: " ▴"; }
  details.fold > .in { padding: 0 16px 16px; }

  /* מסמך לקריאה */
  .paper { background: #fff; color: #1b1b1b; border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; font-size: .97rem; max-height: 70vh; overflow-y: auto; }
  .paper h4 { text-align: center; margin: 4px 0 14px; font-size: 1.1rem; text-decoration: underline; }
  .paper ol { padding-inline-start: 22px; margin: 12px 0; }
  .paper li { margin-bottom: 8px; }
  .paper .sub { font-weight: 700; margin: 16px 0 6px; }
  .form-img { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; max-height: 70vh; overflow-y: auto; }
  .form-img img { display: block; width: 100%; height: auto; }

  /* טפסים */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; }
  .field input, .field select, .exp input, .exp select { font-size: .95rem; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
  .field input:focus, .field select:focus, .exp input:focus, .exp select:focus { outline: 2px solid var(--main); border-color: transparent; }
  .choice { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
  .choice label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  .choice input { accent-color: var(--main); }
  .section-title { margin: 20px 0 8px; font-weight: 700; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; margin-top: 14px; }
  .check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--main); flex: none; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .msg { font-size: .9rem; font-weight: 700; }
  .msg.bad { color: var(--hot); } .msg.ok { color: var(--main); }
  .fine { font-size: .82rem; color: var(--muted); margin: 10px 0 0; }
  .exp-list { margin-top: 14px; display: grid; gap: 10px; }
  .exp { display: grid; grid-template-columns: 1.3fr 1fr 1fr .7fr 1.4fr auto; gap: 8px; align-items: center; background: var(--soft); border-radius: 10px; padding: 10px; }
  .exp .meals { grid-column: 1 / -1; display: flex; gap: 14px; font-size: .88rem; color: var(--muted); align-items: center; }
  .exp .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 4px 8px; }
  .ghost { border: 1px dashed var(--main); background: none; color: var(--main); font-weight: 700; padding: 7px 14px; border-radius: 10px; cursor: pointer; }
  .total { font-weight: 700; }
  .poa { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }

  /* מחשבון */
  .calc-out { margin-top: 14px; display: grid; gap: 8px; }
  .calc-line { display: flex; justify-content: space-between; gap: 12px; background: var(--soft); border-radius: 10px; padding: 12px 14px; flex-wrap: wrap; }
  .calc-line b { font-family: "Rubik", sans-serif; font-size: 1.1rem; }

  @media (max-width: 640px) {
    .panel, .doc-card { padding: 16px; }
    .exp { grid-template-columns: 1fr 1fr; }
    .exp .del { justify-self: end; }
  }

  /* הדפסה */
  #print { display: none; }
  @media print {
    body { background: #fff; color: #000; font-size: 12pt; }
    .wrap { display: none; }
    #print { display: block; padding: 0 8mm; }
    #print h1 { text-align: center; font-size: 15pt; text-decoration: underline; margin: 0 0 10pt; }
    #print table { width: 100%; border-collapse: collapse; margin: 6pt 0 10pt; }
    #print td { border: 1px solid #999; padding: 4pt 6pt; vertical-align: top; }
    #print td.k { width: 26%; font-weight: 700; background: #f2f2f2; }
    #print ol { padding-inline-start: 18pt; } #print li { margin-bottom: 4pt; }
    #print .sig { display: flex; justify-content: space-between; gap: 20pt; margin-top: 18pt; }
    #print .sig div { flex: 1; border-top: 1px solid #000; padding-top: 3pt; text-align: center; font-size: 10pt; }
    #print .sig b { display: block; font-size: 12pt; margin-bottom: 14pt; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <a class="logo" href="#" aria-label="לכל המסמכים"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C11 2 10.5 3 10.5 4V9L3 13.5V15.5L10.5 13V18L8.5 19.5V21L12 20L15.5 21V19.5L13.5 18V13L21 15.5V13.5L13.5 9V4C13.5 3 13 2 12 2Z"/></svg></a>
    <div><h1>מאגר מסמכים</h1><p>נסיעות בתפקיד לחו"ל: טפסים, מילוי מקוון ומחשבון זכאות</p></div>
  </header>
  <main id="app"></main>
  <datalist id="countries"></datalist>
</div>
<div id="print" aria-hidden="true"></div>

<script>
  // ---------- רשימת המסמכים במאגר ----------
  const DOCS = [
    { id: "advance", icon: "💳", title: "מקדמה: מזומן או כרטיס אשראי", desc: "בקשה למקדמה לפני נסיעה בתפקיד, כולל ההתחייבויות, הצהרה על חופשה וייפוי כוח. אפשר לקרוא, למלא ולשלוח." },
    { id: "settle", icon: "🧾", title: "התחשבנות לאחר נסיעה", desc: "הטופס המקורי לקריאה ולהורדה, מילוי מקוון של ההוצאות ושליחה בוואטסאפ. מגישים עד חודש מיום החזרה." },
    { id: "calc", icon: "🧮", title: "מחשבון אשל ולינה", desc: "בוחרים מדינה ותאריכים ומקבלים את קצובת השהייה והלינה לפי טבלת החשב הכללי." }
  ];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const parse = d => { const m = String(d || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const fmtD = x => x ? x.toLocaleDateString("he-IL", { day: "numeric", month: "numeric", year: "numeric" }) : "";
  const fmt = d => fmtD(parse(d));
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const docUrl = id => location.origin + location.pathname + "#" + id;
  const waNumber = () => typeof WHATSAPP_NUMBER !== "undefined" ? String(WHATSAPP_NUMBER).replace(/\D/g, "") : "";

  function actionsHtml(d, withOpen) {
    return `${withOpen ? `<a class="btn primary" href="#${d.id}">פתיחה</a>` : ""}
      <button class="btn line" data-copy="${d.id}">העתקת קישור</button>
      <button class="btn wa" data-share="${d.id}">שליחת הקישור בוואטסאפ</button>
      <span class="copied" data-copied="${d.id}"></span>`;
  }

  // ---------- מאגר ----------
  function libraryHtml() {
    return `<div class="lib">${DOCS.map(d => `
      <article class="doc-card">
        <div class="icon" aria-hidden="true">${d.icon}</div>
        <h2>${esc(d.title)}</h2>
        <p>${esc(d.desc)}</p>
        <div class="actions">${actionsHtml(d, true)}</div>
      </article>`).join("")}</div>`;
  }

  function docHead(d) {
    return `<a class="back" href="#">→ לכל המסמכים</a>
      <div class="doc-head"><h2>${esc(d.title)}</h2><p>${esc(d.desc)}</p><div class="actions">${actionsHtml(d, false)}</div></div>`;
  }

  // ---------- מחשבון ----------
  const hasRates = () => typeof RATES !== "undefined" && RATES.length;
  const countryLabel = r => `${r[0]} (${r[1]})`;
  function calcHtml() {
    if (!hasRates()) return `<div class="callout bad">טבלת התעריפים לא נטענה. כדאי לבדוק שהקובץ rates.js נמצא באתר.</div>`;
    const expired = typeof RATES_VALID_TO !== "undefined" && parse(RATES_VALID_TO) < today();
    return `<section class="panel" data-calc>
      <div class="form-grid">
        <label class="field">מדינת יעד<input list="countries" data-c="country" placeholder="למשל: ארצות הברית"></label>
        <label class="field">עיר<select data-c="city" disabled><option>בוחרים קודם מדינה</option></select></label>
        <label class="field">תאריך התחלה<input type="date" data-c="from"></label>
        <label class="field">תאריך סיום<input type="date" data-c="to"></label>
      </div>
      <div class="calc-out" data-c="out"></div>
      <p class="fine">החישוב לפי ${esc(typeof RATES_SOURCE !== "undefined" ? RATES_SOURCE : "טבלת התעריפים")}. ימים נספרים כימים קלנדריים מיום ההתחלה עד יום הסיום כולל, ולילות כמספר הלילות ביניהם. זו הערכה בלבד; הזכאות הסופית נקבעת לפי הוראת תכ"ם 13.10.2, כולל הכללים לימי יציאה וחזרה ולחופשה פרטית.</p>
      ${expired ? `<div class="callout warn" style="margin-top:12px">שימו לב: הטבלה בתוקף עד ${fmt(RATES_VALID_TO)}. ייתכן שפורסמה מהדורה חדשה עם תעריפים מעודכנים.</div>` : ""}
    </section>`;
  }
  function runCalc(box) {
    const q = s => box.querySelector(`[data-c="${s}"]`);
    const typed = q("country").value.trim();
    const rows = RATES.filter(r => countryLabel(r) === typed || r[0] === typed || r[1].toLowerCase() === typed.toLowerCase());
    const citySel = q("city"), prev = citySel.value;
    if (rows.length) {
      const cities = [...new Set(rows.map(r => r[2]))];
      citySel.innerHTML = cities.map(c => `<option ${c === prev ? "selected" : ""}>${esc(c)}</option>`).join("");
      citySel.disabled = cities.length < 2;
    } else { citySel.innerHTML = `<option>${typed ? "יעד שלא בטבלה" : "בוחרים קודם מדינה"}</option>`; citySel.disabled = true; }
    const from = parse(q("from").value), to = parse(q("to").value), out = q("out");
    if (!typed || !from || !to) { out.innerHTML = ""; return; }
    if (to < from) { out.innerHTML = `<div class="callout bad">תאריך הסיום לפני תאריך ההתחלה.</div>`; return; }
    const days = Math.round((to - from) / 86400000) + 1, nights = days - 1, n = x => x.toLocaleString("he-IL");
    if (!rows.length) {
      out.innerHTML = `<div class="callout">היעד לא נמצא בטבלה. ליעדים שאינם בטבלה קצובת השהייה היא ${RATES_DEFAULT_PERDIEM} ₪ ליום, כלומר <b>${n(RATES_DEFAULT_PERDIEM * days)} ₪</b> ל-${days} ימים. את קצובת הלינה יש לבדוק מול הגורם המאשר.</div>`;
      return;
    }
    const r = rows.find(x => x[2] === citySel.value) || rows[0];
    out.innerHTML = `
      <div class="calc-line"><span>קצובת שהייה (אשל): ${n(r[5])} ₪ ליום × ${days} ${days === 1 ? "יום" : "ימים"}</span><b>${n(r[5] * days)} ₪</b></div>
      <div class="calc-line"><span>קצובת לינה: עד ${n(r[4])} ${r[3]} ללילה × ${nights} ${nights === 1 ? "לילה" : "לילות"}</span><b>עד ${n(r[4] * nights)} ${r[3]}</b></div>`;
  }

  // ---------- שדות פרטי הנוסע (משותפים לשני הטפסים) ----------
  function travelerFields() {
    return `<div class="form-grid">
      <label class="field">שם הנוסע/ת<input data-f="name" autocomplete="name"></label>
      <label class="field">מספר תעודת זהות<input data-f="id" inputmode="numeric"></label>
      <label class="field">דרגה / תפקיד<input data-f="rank"></label>
      <label class="field">מס' נייד<input data-f="phone" inputmode="tel" autocomplete="tel"></label>
      <label class="field">כתובת מייל<input data-f="email" type="email" autocomplete="email"></label>
      <label class="field">יעד<input data-f="dest"></label>
      <label class="field">תאריך יציאה מהארץ<input type="date" data-f="out"></label>
      <label class="field">שעת המראה<input type="time" data-f="outTime"></label>
      <label class="field">תאריך חזרה לארץ<input type="date" data-f="back"></label>
      <label class="field">שעת נחיתה<input type="time" data-f="backTime"></label>
    </div>`;
  }
  const val = (box, n) => { const el = box.querySelector(`[data-f="${n}"]`); return el ? (el.value || "").trim() : ""; };
  const checked = (box, n) => { const el = box.querySelector(`[data-f="${n}"]`); return !!(el && el.checked); };
  function travelerLines(box) {
    const v = n => val(box, n);
    return [
      `שם: ${v("name")} | ת"ז: ${v("id")}`,
      v("rank") ? `דרגה/תפקיד: ${v("rank")}` : "",
      v("phone") || v("email") ? `נייד: ${v("phone")}${v("email") ? ` | מייל: ${v("email")}` : ""}` : "",
      v("dest") ? `יעד: ${v("dest")}` : "",
      v("out") ? `יציאה: ${fmt(v("out"))} ${v("outTime")}`.trim() : "",
      v("back") ? `חזרה: ${fmt(v("back"))} ${v("backTime")}`.trim() : ""
    ].filter(Boolean);
  }
  function openWhatsApp(text) { window.open(`https://wa.me/${waNumber()}?text=${encodeURIComponent(text)}`, "_blank", "noopener"); }
  function say(box, text, ok) { const m = box.querySelector("[data-msg]"); m.className = "msg " + (ok ? "ok" : "bad"); m.textContent = text; }

  // ---------- מקדמה ----------
  const ADV_TITLE = "מקדמה מזומן / הקצאה בכרטיס אשראי עבור נסיעה בתפקיד";
  const ADV_REQUEST = 'אבקש ממשרד הביטחון להעביר לי הרשאה למשיכת מזומן/כרטיס אשראי עבור שהותי בתפקיד בחו"ל עפ"י הקצובה שנקבעה ע"י החשכ"ל.';
  const ADV_TERMS = [
    'אני מתחייב/ת להתחשבן בצירוף קבלות ע"י סריקה באפליקציית כאל בהתאם להנחיות שהועברו למתן כרטיס אשראי, או במקרים חריגים של מזומן ע"י סריקה למייל חט\' נסיעות חו"ל.',
    "אני מתחייב/ת להצהיר על ארוחות רשמיות שהוזמנתי בעת ההתחשבנות בגמר הנסיעה.",
    'אני מתחייב/ת לבצע התחשבנות עד 30 יום מתאריך הגעתי ארצה, אחרת ההתחשבנות תתבצע חד צדדית ע"י חטיבת חשבונות חו"ל/אגף הכספים משהב"ט.',
    'ידוע לי שיתרת חובה לגבייה תתבצע ע"י חיוב כרטיס האשראי האישי בשקלים, בהתאם לשער המטבע היציג ביום הנסיעה, ויתרה לזכותי תועבר לחשבון הבנק אשר בבעלותי. מצ"ב צילום כרטיס האשראי האישי משני צדדיו.',

  const ADV_VACATION = [

        <div class="form-grid" data-vac hidden style="margin-top:10px">

        </div>
        <label class="check"><input type="checkbox" data-f="poa"><span>הכסף יימשך עבורי באמצעות אדם אחר (ייפוי כוח)</span></label>
        <div class="poa form-grid" data-poa hidden>

        <div class="row-btns">

        <p class="fine">הטופס לא נשמר באתר. אחרי השליחה מצרפים בצ'אט את צילום כרטיס האשראי ואת טופס ניהול החשבון. אם נדרש טופס חתום, מדפיסים את הטופס הממולא, חותמים ושולחים סריקה.</p>

  function advanceText(box) {
    const type = box.querySelector('input[name="advType"]:checked').value;
    const vac = box.querySelector('input[name="vac"]:checked').value;
    const lines = [`*${ADV_TITLE}*`, `תאריך: ${fmtD(today())}`, ...travelerLines(box), `סוג המקדמה: ${type}`,
      `חופשה פרטית במסגרת הנסיעה: ${vac}${vac === "כן" && (val(box, "vacFrom") || val(box, "vacTo")) ? ` (${fmt(val(box, "vacFrom"))} – ${fmt(val(box, "vacTo"))})` : ""}`];
    if (checked(box, "poa")) lines.push(`ייפוי כוח: ${val(box, "poaName")}, ת"ז ${val(box, "poaId")}`);
    lines.push("", `✓ ${ADV_DECL}`, `חתימה: ${val(box, "name")}`, "", "מצורפים בהודעות הבאות: צילום כרטיס אשראי אישי משני הצדדים, טופס ניהול חשבון.");

  }
  function advancePrint(box) {
    const v = n => esc(val(box, n));
    const type = box.querySelector('input[name="advType"]:checked').value;
    const vac = box.querySelector('input[name="vac"]:checked').value;
    const row = (k, x) => `<tr><td class="k">${k}</td><td>${x}</td></tr>`;
    return `<p>תאריך: ${fmtD(today())}</p><p>אל: משרד הביטחון – אגף הכספים</p>
      <h1>${esc(ADV_TITLE)}</h1>
      <table>${row("שם הנוסע/ת", v("name"))}${row("מספר תעודת זהות", v("id"))}${row("דרגה / תפקיד", v("rank"))}${row("מס' נייד", v("phone"))}${row("כתובת מייל", v("email"))}${row("יעד", v("dest"))}
        ${row("יציאה מהארץ", `${fmt(val(box, "out"))} ${v("outTime")}`)}${row("חזרה לארץ", `${fmt(val(box, "back"))} ${v("backTime")}`)}${row("סוג המקדמה", esc(type))}
        ${row("חופשה פרטית", esc(vac) + (vac === "כן" ? ` ${fmt(val(box, "vacFrom"))} – ${fmt(val(box, "vacTo"))}` : ""))}</table>

      <div class="sig"><div><b>${fmtD(today())}</b>תאריך</div><div><b>${v("name")}</b>שם פרטי ומשפחה</div><div><b>&nbsp;</b>חתימה</div></div>
      ${checked(box, "poa") ? `<p style="margin-top:18pt"><b>ייפוי כוח:</b> אני ${v("name")} (ת"ז ${v("id")}) מייפה את כוחו/ה של ${v("poaName")} (ת"ז ${v("poaId")}) לקחת בשמי ובמקומי את שובר המקדמה לבנק ולמשוך עבורי את הכסף מהבנק. בזאת, אני לוקח/ת את האחריות על השובר והכסף ולא תהיה לי כל טענה למשרד הביטחון בעניין.</p>
        <div class="sig"><div><b>&nbsp;</b>חתימת הנוסע/ת</div><div><b>&nbsp;</b>חתימת המיופה/ה</div></div>` : ""}
      <p style="margin-top:14pt">מצורף: צילום כרטיס האשראי האישי משני צדדיו, טופס ניהול חשבון.</p>`;
  }

  // ---------- התחשבנות ----------
  const EXPENSES = ["כלכלה", "לינה", 'הוצאות רכב בחו"ל', "תחבורה ל/מ שדה התעופה בארץ", 'תחבורה ל/מ שדה התעופה בחו"ל', "אחר"];
  const SETTLE_DECL = 'אני החתום/ה מטה מצהיר/ה בזאת כי הקבלות וההוצאות שהצגתי בפני אגף הכספים/חטיבת פרט והסדרי נסיעות חו"ל הינן הוצאות שהוצאו בפועל במסגרת נסיעתי בתפקיד בלבד. הנני מודע/ת לכך כי במקרה שהפרטים הנ"ל אינם נכונים אדרש להשיב את הכספים ששולמו לי ביתר ועלול/ה להיפתח נגדי הליך משמעתי.';
  function expRow() {
    return `<div class="exp">
      <select data-e="type" aria-label="סוג ההוצאה">${EXPENSES.map(e => `<option>${esc(e)}</option>`).join("")}</select>
      <input type="date" data-e="date" aria-label="תאריך">
      <input type="number" min="0" step="0.01" data-e="amount" placeholder="סכום" aria-label="סכום">
      <select data-e="cur" aria-label="מטבע"><option>₪</option><option>$</option><option>€</option><option>£</option><option>אחר</option></select>
      <input data-e="note" placeholder="הערות" aria-label="הערות">
      <button type="button" class="del" data-del aria-label="מחיקת השורה">✕</button>
      <div class="meals">ארוחות לקיזוז:
        <label><input type="checkbox" data-e="m1"> בוקר</label>
        <label><input type="checkbox" data-e="m2"> צהריים</label>
        <label><input type="checkbox" data-e="m3"> ערב</label>
      </div>
    </div>`;
  }
  function settleHtml() {
    return `
      <div class="callout" data-due>את ההתחשבנות מגישים <b>עד חודש מיום החזרה ארצה</b>. אחרי שממלאים את תאריך החזרה, יופיע כאן המועד האחרון.</div>
      <div class="callout warn"><b>יש לצרף בנוסף לטופס:</b><ul><li>קבלות סרוקות</li><li>אישור ניהול חשבון בנק</li><li>צילום כרטיס אשראי משני הצדדים</li></ul></div>
      <details class="fold"><summary>1. קריאת הטופס לפני המילוי</summary><div class="in">
        <a class="form-img" href="settlement-form.jpg" target="_blank" rel="noopener" title="פתיחת הטופס בגודל מלא">
          <img src="settlement-form.jpg" alt="טופס התחשבנות לאחר נסיעת חו&quot;ל בתפקיד" loading="lazy">
        </a>
        <div class="row-btns">
          <a class="btn line" href="settlement-form.jpg" target="_blank" rel="noopener">הגדלת הטופס</a>
          <a class="btn line" href="settlement-form.pdf" target="_blank" rel="noopener" download>הורדת הטופס (PDF)</a>
        </div>
      </div></details>
      <details class="fold" open><summary>2. מילוי מקוון</summary><div class="in" data-form="settle">
        ${travelerFields()}
        <div class="form-grid" style="margin-top:10px"><label class="field">נמשכה מקדמה בסכום של<input data-f="advance" inputmode="decimal"></label></div>
        <p class="section-title">ההוצאות בפועל לזמן השהות בתפקיד בלבד</p>
        <div class="exp-list" data-exps>${expRow()}</div>
        <div class="row-btns"><button type="button" class="ghost" data-add>+ הוספת הוצאה</button><span class="total" data-total></span></div>
        <label class="check"><input type="checkbox" data-f="decl"><span>${esc(SETTLE_DECL)}</span></label>
        <div class="row-btns">
          <button class="btn wa" data-send="settle">שליחה בוואטסאפ</button>
          <span data-msg></span>
        </div>
        <p class="fine">הטופס לא נשמר באתר. אחרי השליחה מצרפים בצ'אט את הקבלות הסרוקות, אישור ניהול החשבון וצילום כרטיס האשראי.</p>
      </div></details>`;
  }
  function expData(row) {
    const g = n => row.querySelector(`[data-e="${n}"]`);
    return { type: g("type").value, date: g("date").value, amount: parseFloat(g("amount").value) || 0, cur: g("cur").value, note: g("note").value.trim(),
             meals: ["m1", "m2", "m3"].filter(m => g(m).checked).map(m => ({ m1: "בוקר", m2: "צהריים", m3: "ערב" })[m]) };
  }
  function refreshSettle(box) {
    box.querySelectorAll(".exp").forEach(r => { r.querySelector(".meals").hidden = r.querySelector('[data-e="type"]').value !== "כלכלה"; });
    const sums = {};
    box.querySelectorAll(".exp").forEach(r => { const e = expData(r); if (e.amount) sums[e.cur] = (sums[e.cur] || 0) + e.amount; });
    const parts = Object.entries(sums).map(([c, v]) => `${v.toLocaleString("he-IL")} ${c}`);
    box.querySelector("[data-total]").textContent = parts.length ? `סה"כ: ${parts.join(" + ")}` : "";
    const back = parse(val(box, "back")), due = document.querySelector("[data-due]");
    if (back && due) {
      const d = new Date(back); d.setMonth(d.getMonth() + 1);
      const left = Math.round((d - today()) / 86400000);
      due.className = "callout" + (left < 0 ? " bad" : "");
      due.innerHTML = left < 0 ? `המועד להגשת ההתחשבנות עבר (${fmtD(d)}).` : `את ההתחשבנות מגישים <b>עד ${fmtD(d)}</b>, חודש מיום החזרה${left <= 31 ? `. נשארו ${left} ימים` : ""}.`;
    }
  }
  function settleText(box) {
    const lines = [`*התחשבנות לאחר נסיעת חו"ל בתפקיד*`, `תאריך: ${fmtD(today())}`, ...travelerLines(box),
      val(box, "advance") ? `נמשכה מקדמה בסכום של: ${val(box, "advance")}` : "נמשכה מקדמה: לא צוין", "", "*הוצאות:*"];
    const exps = [...box.querySelectorAll(".exp")].map(expData).filter(e => e.amount || e.meals.length || e.note || e.date);
    if (!exps.length) lines.push("אין הוצאות");
    exps.forEach(e => lines.push(`• ${e.type}${e.date ? ` | ${fmt(e.date)}` : ""}${e.amount ? ` | ${e.amount.toLocaleString("he-IL")} ${e.cur}` : ""}${e.meals.length ? ` | ארוחות לקיזוז: ${e.meals.join(", ")}` : ""}${e.note ? ` | ${e.note}` : ""}`));
    const total = box.querySelector("[data-total]").textContent; if (total) lines.push(total);
    lines.push("", "✓ הצהרתי כי ההוצאות הוצאו בפועל במסגרת נסיעתי בתפקיד בלבד.", `חתימה: ${val(box, "name")}`, "", "מצורפים בהודעות הבאות: קבלות סרוקות, אישור ניהול חשבון בנק, צילום כרטיס אשראי משני הצדדים.");
    return lines.join("\n");
  }

  // ---------- ניווט ----------
  function render() {
    const id = location.hash.replace("#", "");
    const d = DOCS.find(x => x.id === id);
    const app = document.getElementById("app");
    if (!d) { app.innerHTML = libraryHtml(); document.title = "מאגר מסמכים – נסיעות בתפקיד"; return; }
    const body = id === "calc" ? calcHtml() : id === "advance" ? `<section class="panel">${advanceHtml()}</section>` : `<section class="panel">${settleHtml()}</section>`;
    app.innerHTML = docHead(d) + body;
    document.title = d.title;
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);

  function copyLink(id, done) {
    const url = docUrl(id);
    const ok = () => { const el = document.querySelector(`[data-copied="${id}"]`); if (el) { el.textContent = "הקישור הועתק"; setTimeout(() => el.textContent = "", 2500); } };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, () => window.prompt("העתיקו את הקישור:", url));
    else window.prompt("העתיקו את הקישור:", url);
  }

  document.addEventListener("click", e => {
    const c = e.target.closest("[data-copy]");
    if (c) { copyLink(c.dataset.copy); return; }
    const s = e.target.closest("[data-share]");
    if (s) {
      const d = DOCS.find(x => x.id === s.dataset.share);
      window.open(`https://wa.me/?text=${encodeURIComponent(`${d.title}\n${docUrl(d.id)}`)}`, "_blank", "noopener");
      return;
    }
    const add = e.target.closest("[data-add]");
    if (add) { const box = add.closest("[data-form]"); box.querySelector("[data-exps]").insertAdjacentHTML("beforeend", expRow()); refreshSettle(box); return; }
    const del = e.target.closest("[data-del]");
    if (del) { const box = del.closest("[data-form]"); del.closest(".exp").remove(); refreshSettle(box); return; }
    const send = e.target.closest("[data-send]");
    if (send) {
      const box = send.closest("[data-form]");
      if (!val(box, "name") || !val(box, "id")) { say(box, "חסרים שם ומספר תעודת זהות."); return; }
      if (!checked(box, "decl")) { say(box, "יש לסמן את ההצהרה לפני השליחה."); return; }
      openWhatsApp(send.dataset.send === "advance" ? advanceText(box) : settleText(box));
      say(box, "נפתח וואטסאפ. לא לשכוח לצרף את הקבצים.", true);
      return;
    }
    const pr = e.target.closest("[data-print]");
    if (pr) {
      const box = pr.closest("[data-form]");
      if (!val(box, "name")) { say(box, "כדאי למלא לפחות שם לפני ההדפסה."); return; }
      document.getElementById("print").innerHTML = advancePrint(box);
      window.print();
    }
  });
  function onField(e) {
    const calc = e.target.closest("[data-calc]"); if (calc) runCalc(calc);
    const box = e.target.closest("[data-form]");
    if (!box) return;
    if (box.dataset.form === "settle") refreshSettle(box);
    if (box.dataset.form === "advance") {
      box.querySelector("[data-vac]").hidden = box.querySelector('input[name="vac"]:checked').value !== "כן";
      box.querySelector("[data-poa]").hidden = !checked(box, "poa");
    }
  }
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);

  // טוענים את ההגדרות ואת טבלת התעריפים (תמיד בגרסה העדכנית), ואז מציגים
  function load(src) { return new Promise(r => { const s = document.createElement("script"); s.src = src + "?v=" + Date.now(); s.onload = s.onerror = r; document.body.appendChild(s); }); }
  Promise.all([load("data.js"), load("rates.js")]).then(() => {
    if (hasRates()) document.getElementById("countries").innerHTML = RATES.filter((r, j, a) => a.findIndex(x => x[1] === r[1]) === j).map(r => `<option value="${esc(countryLabel(r))}">`).join("");
    render();
  });
</script>
</body>
</html>
