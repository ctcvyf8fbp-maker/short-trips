<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מאגר מסמכים – נסיעות בתפקיד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8; --card: #FFFFFF; --ink: #16181D; --muted: #707680; --line: #E4E6EA; --soft: #F1F2F4;
    --main: #0F6B5C; --main-soft: #E2F2EE; --hot: #C9302C; --hot-soft: #FDE8E6; --warn: #FBEFD9; --warn-ink: #6B4A00;
    --wa: #1F9D55;
    --shadow: 0 1px 2px rgba(22,24,29,.05), 0 6px 18px rgba(22,24,29,.05);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111416; --card: #1A1E21; --ink: #ECEEF0; --muted: #98A0A8; --line: #2B3136; --soft: #23282C;
      --main: #4FC3A9; --main-soft: #173A33; --hot: #F0675C; --hot-soft: #3E1F1C; --warn: #3A2E16; --warn-ink: #F2D59A;
      --shadow: none;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 "Assistant", "Segoe UI", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--main); outline-offset: 3px; border-radius: 6px; }
  a { color: var(--main); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 30px 18px 64px; }

  .site-head { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .site-head .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--main); display: grid; place-items: center; flex: none; }
  .site-head .logo svg { width: 26px; height: 26px; fill: var(--card); transform: rotate(-45deg); }
  .site-head h1 { margin: 0; font: 700 clamp(1.5rem, 4.6vw, 2rem)/1.15 "Rubik", "Assistant", sans-serif; }
  .site-head p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

  /* מאגר */
  .lib { display: grid; gap: 14px; }
  .doc-card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  .doc-card .icon { grid-row: span 2; width: 46px; height: 46px; border-radius: 12px; background: var(--main-soft); color: var(--main); display: grid; place-items: center; font-size: 1.4rem; }
  .doc-card h2 { margin: 0; font: 700 1.2rem/1.3 "Rubik", "Assistant", sans-serif; }
  .doc-card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .doc-card .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; padding: 8px 15px; font-weight: 700; font-size: .92rem; cursor: pointer; text-decoration: none; border: 1px solid transparent; }
  .btn.primary { background: var(--main); color: var(--card); }
  .btn.line { background: var(--card); border-color: var(--main); color: var(--main); }
  .btn.wa { background: var(--wa); color: #fff; }
  .btn.quiet { background: var(--soft); color: var(--ink); }
  .copied { color: var(--main); font-weight: 700; font-size: .88rem; align-self: center; }

  /* עמוד מסמך */
  .back { display: inline-block; margin-bottom: 14px; font-weight: 600; text-decoration: none; }
  .doc-head h2 { margin: 0 0 4px; font: 700 clamp(1.5rem, 4.6vw, 2rem)/1.2 "Rubik", "Assistant", sans-serif; }
  .doc-head p { margin: 0 0 14px; color: var(--muted); }
  .doc-head .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .panel { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .panel > h3 { margin: 0 0 12px; font: 700 1.1rem "Rubik", "Assistant", sans-serif; }
  .callout { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: .95rem; }
  .callout.warn { background: var(--warn); color: var(--warn-ink); }
  .callout.bad { background: var(--hot-soft); color: var(--hot); }
  .callout ul { margin: 6px 0 0; padding-inline-start: 20px; }
  details.fold { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; background: var(--card); }
  details.fold > summary { cursor: pointer; padding: 14px 16px; font-weight: 700; list-style: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: " ▾"; color: var(--muted); }
  details.fold[open] > summary::after { content: " ▴"; }
  details.fold > .in { padding: 0 16px 16px; }

  /* מסמך לקריאה */
  .paper h4 { text-align: center; margin: 4px 0 14px; font-size: 1.1rem; text-decoration: underline; }
  .paper ol { padding-inline-start: 22px; margin: 12px 0; }
  .paper li { margin-bottom: 8px; }
  .paper .sub { font-weight: 700; margin: 16px 0 6px; }
  .form-img { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; max-height: 70vh; overflow-y: auto; }
  .form-img img { display: block; width: 100%; height: auto; }

  /* טפסים */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; }
  .field input, .field select, .exp input, .exp select { font-size: .95rem; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
  .field input:focus, .field select:focus, .exp input:focus, .exp select:focus { outline: 2px solid var(--main); border-color: transparent; }
  .choice { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
  .choice label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  .choice input { accent-color: var(--main); }
  .section-title { margin: 20px 0 8px; font-weight: 700; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; margin-top: 14px; }
  .check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--main); flex: none; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .msg { font-size: .9rem; font-weight: 700; }
  .msg.bad { color: var(--hot); } .msg.ok { color: var(--main); }
  .fine { font-size: .82rem; color: var(--muted); margin: 10px 0 0; }
  .exp-list { margin-top: 14px; display: grid; gap: 10px; }
  .exp { display: grid; grid-template-columns: 1.3fr 1fr 1fr .7fr 1.4fr auto; gap: 8px; align-items: center; background: var(--soft); border-radius: 10px; padding: 10px; }
  .exp .meals { grid-column: 1 / -1; display: flex; gap: 14px; font-size: .88rem; color: var(--muted); align-items: center; }
  .exp .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 4px 8px; }
  .ghost { border: 1px dashed var(--main); background: none; color: var(--main); font-weight: 700; padding: 7px 14px; border-radius: 10px; cursor: pointer; }
  .total { font-weight: 700; }
  .poa { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }

  /* מחשבון */
  .calc-out { margin-top: 14px; display: grid; gap: 8px; }
  .calc-line { display: flex; justify-content: space-between; gap: 12px; background: var(--soft); border-radius: 10px; padding: 12px 14px; flex-wrap: wrap; }
  .calc-line b { font-family: "Rubik", sans-serif; font-size: 1.1rem; }

  @media (max-width: 640px) {
    .panel, .doc-card { padding: 16px; }
    .exp { grid-template-columns: 1fr 1fr; }
    .exp .del { justify-self: end; }
  }

  /* טופס בפורמט המקורי */
  .hint { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
  .paper-scroll { overflow-x: auto; margin: 0 -4px 14px; padding: 4px; }
  .paper { background: #fff; color: #111; width: 100%; max-width: 820px; min-width: 640px; margin: 0 auto 16px; padding: 34px 40px; border-radius: 6px;
           box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); font: 16px/1.85 "Arial", "Assistant", sans-serif; }
  .paper h4 { text-align: center; text-decoration: underline; font-size: 19px; margin: 6px 0 16px; }
  .paper p { margin: 0 0 8px; }
  .paper .para { text-indent: 0; margin-bottom: 10px; }
  .paper .fl { line-height: 2.3; }
  .paper .opt label { margin-inline-start: 14px; white-space: nowrap; }
  .paper .opt input { accent-color: #0F6B5C; width: 16px; height: 16px; vertical-align: -2px; }
  input.ln { border: 0; border-bottom: 1px solid #333; background: #F3F8F6; color: #0b2a6b; font: inherit; padding: 0 6px; height: 26px; border-radius: 2px 2px 0 0; vertical-align: baseline; }
  input.ln:focus { outline: 2px solid #0F6B5C; background: #E2F2EE; }
  input.ln.w1 { width: 90px; } input.ln.w2 { width: 140px; } input.ln.w3 { width: 190px; }
  .sign-row { display: flex; gap: 28px; margin-top: 30px; align-items: flex-end; }
  .sign-row > div { flex: 1; display: flex; flex-direction: column; gap: 4px; text-align: center; font-size: 14px; }
  .sign-row input.ln { width: 100%; text-align: center; }
  .sign-row.two { max-width: 560px; }
  .sig-wrap { position: relative; display: inline-block; vertical-align: bottom; }
  canvas.sig { width: 220px; height: 64px; border-bottom: 1px solid #333; background: #F3F8F6; touch-action: none; cursor: crosshair; display: block; }
  .sign-row canvas.sig { width: 100%; }
  .sig-wrap { width: 220px; } .sign-row .sig-wrap { width: 100%; }
  .sig-clear { position: absolute; top: 2px; left: 2px; font-size: 11px; border: 0; background: rgba(255,255,255,.85); color: #555; border-radius: 6px; padding: 1px 6px; cursor: pointer; }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
  .tbl th { border: 1px solid #333; padding: 6px; background: #fff; font-weight: 700; }
  .tbl td { border: 1px solid #333; padding: 3px 4px; vertical-align: middle; text-align: center; }
  .tbl td.type { width: 17%; text-align: start; font-weight: 600; vertical-align: top; padding: 6px; }
  .tbl td.note { width: 34%; text-align: start; font-size: 12.5px; line-height: 1.45; vertical-align: top; padding: 6px; }
  .tbl td.m { width: 8%; white-space: nowrap; }
  .tbl td.m input[type="checkbox"] { width: 17px; height: 17px; accent-color: #0F6B5C; vertical-align: middle; }
  .meal { display: inline-flex; align-items: center; gap: 3px; }
  .cnt { width: 36px; border: 1px solid #9bb; border-radius: 4px; background: #F3F8F6; color: #0b2a6b; font: inherit; font-size: 13px; text-align: center; padding: 1px 2px; }
  .tbl input.cell { width: 100%; min-width: 0; border: 0; background: #F3F8F6; color: #0b2a6b; font: inherit; padding: 4px; text-align: center; }
  .tbl tbody[data-group="food"] td.type, .tbl tbody[data-group="taxiIL"] td.type, .tbl tbody[data-group="taxiAbroad"] td.type { background: #f4f4f4; }
  .add-line { display: block; margin-top: 6px; border: 1px dashed #0F6B5C; color: #0F6B5C; background: #fff; border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
  .decl-title { text-align: center; margin-top: 4px; }
  .swipe { display: none; font-size: 13px; color: #0F6B5C; margin: 0 0 4px; }
  .actions-box { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 20px; }
  .actions-box .check { margin-top: 0; }
  .alert-box { margin-top: 10px; background: var(--hot-soft); color: var(--hot); font-weight: 700; border-radius: 10px; padding: 10px 12px; }
  .need { outline: 3px solid var(--hot) !important; outline-offset: 2px; }
  .tip { margin: 10px 0 0; font-size: .92rem; background: var(--main-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; }
  .tip:empty { display: none; }
  .draft-line { margin: 10px 0 0; font-size: .85rem; color: var(--muted); }
  .quiet-link { color: var(--muted) !important; }
  .link-btn { border: 0; background: none; color: var(--hot); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }

  /* טלפון: הטופס מתאים את עצמו לרוחב המסך */
  @media screen and (max-width: 700px) {
    .paper-scroll { overflow: visible; margin: 0 0 14px; padding: 0; }
    .paper { min-width: 0; padding: 20px 14px; font-size: 15px; line-height: 1.7; border-radius: 10px; }
    .paper h4 { font-size: 17px; }
    .paper .fl { line-height: 2.2; }
    input.ln { font-size: 16px; max-width: 100%; height: 30px; }
    input.ln.w1 { width: 96px; } input.ln.w2 { width: 150px; } input.ln.w3 { width: 100%; }
    .paper .opt label { display: flex; margin: 6px 0 0; white-space: normal; gap: 6px; }
    .sign-row { flex-wrap: wrap; gap: 18px; }
    .sign-row > div { flex: 1 1 100%; }
    .sign-row.two > div { flex: 1 1 100%; }
    .sig-wrap, canvas.sig { width: 100%; }
    canvas.sig { height: 80px; }
    .tbl-wrap { margin: 0 -14px; padding: 0 14px; }
    .swipe { display: block; }
    .tbl { min-width: 620px; font-size: 13px; }
    .tbl input.cell { font-size: 16px; }
    .cnt { font-size: 16px; }
    .doc-head h2 { font-size: 1.5rem; }
  }

  /* הדפסה ושמירה כ-PDF: רק הטופס, בפורמט המקורי */
  @page { size: A4; margin: 12mm; }
  @media print {
    body { background: #fff !important; }
    .site-head, .back, .doc-head, .no-print, .actions-box { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .paper-scroll { overflow: visible; margin: 0; padding: 0; }
    .paper { box-shadow: none; max-width: none; min-width: 0; width: 100%; padding: 0; margin: 0; border-radius: 0; }
    .paper + .paper { break-before: page; }
    input.ln, .tbl input.cell, canvas.sig { background: transparent !important; }
    input[type="date"]:invalid, input[type="time"]:invalid { color: transparent; }
    input::-webkit-calendar-picker-indicator { display: none; }
    .cnt { border: 0; background: transparent; width: 22px; -moz-appearance: textfield; }
    .cnt::-webkit-inner-spin-button, .cnt::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .sig-clear { display: none !important; }
    .tbl tr { break-inside: avoid; }
    .paper { font-size: 11pt; line-height: 1.5; }
    .paper h4 { font-size: 13.5pt; margin: 2pt 0 8pt; }
    .paper .fl { line-height: 1.95; }
    .paper p { margin-bottom: 4pt; }
    .paper .para { margin-bottom: 5pt; }
    input.ln { height: 19px; }
    .sign-row { margin-top: 14pt; }
    canvas.sig { height: 52px; }
    .tbl { font-size: 9.5pt; margin: 4pt 0 6pt; }
    .tbl td.note { font-size: 8.5pt; line-height: 1.3; }
    .tbl td { padding: 2px 3px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <a class="logo" href="#" aria-label="לכל המסמכים"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C11 2 10.5 3 10.5 4V9L3 13.5V15.5L10.5 13V18L8.5 19.5V21L12 20L15.5 21V19.5L13.5 18V13L21 15.5V13.5L13.5 9V4C13.5 3 13 2 12 2Z"/></svg></a>
    <div><h1>מאגר מסמכים</h1><p>נסיעות בתפקיד לחו"ל: טפסים, מילוי מקוון ומחשבון זכאות</p></div>
  </header>
  <main id="app"></main>
  <datalist id="countries"></datalist>
</div>

<script>
  // ---------- רשימת המסמכים במאגר ----------
  const DOCS = [
    { id: "advance", icon: "💳", title: "מקדמה: מזומן או כרטיס אשראי", desc: "בקשה למקדמה לפני נסיעה בתפקיד, כולל ההתחייבויות, הצהרה על חופשה וייפוי כוח. אפשר לקרוא, למלא ולשלוח." },
    { id: "settle", icon: "🧾", title: "התחשבנות לאחר נסיעה", desc: "הטופס המקורי לקריאה ולהורדה, מילוי מקוון של ההוצאות ושליחה בוואטסאפ. מגישים עד חודש מיום החזרה." },
    { id: "calc", icon: "🧮", title: "מחשבון אשל ולינה", desc: "בוחרים מדינה ותאריכים ומקבלים את קצובת השהייה והלינה לפי טבלת החשב הכללי." }
  ];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const parse = d => { const m = String(d || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const fmtD = x => x ? x.toLocaleDateString("he-IL", { day: "numeric", month: "numeric", year: "numeric" }) : "";
  const fmt = d => fmtD(parse(d));
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const docUrl = id => location.origin + location.pathname + "#" + id;
  const waNumber = () => typeof WHATSAPP_NUMBER !== "undefined" ? String(WHATSAPP_NUMBER).replace(/\D/g, "") : "";

  function actionsHtml(d, withOpen) {
    return `${withOpen ? `<a class="btn primary" href="#${d.id}">פתיחה</a>` : ""}
      <button class="btn line" data-copy="${d.id}">העתקת קישור</button>
      <button class="btn wa" data-share="${d.id}">שליחת הקישור בוואטסאפ</button>
      <span class="copied" data-copied="${d.id}"></span>`;
  }

  // ---------- מאגר ----------
  function libraryHtml() {
    return `<div class="lib">${DOCS.map(d => `
      <article class="doc-card">
        <div class="icon" aria-hidden="true">${d.icon}</div>
        <h2>${esc(d.title)}</h2>
        <p>${esc(d.desc)}</p>
        <div class="actions">${actionsHtml(d, true)}</div>
      </article>`).join("")}</div>`;
  }

  function docHead(d) {
    return `<a class="back" href="#">→ לכל המסמכים</a>
      <div class="doc-head"><h2>${esc(d.title)}</h2><p>${esc(d.desc)}</p><div class="actions">${actionsHtml(d, false)}</div></div>`;
  }

  // ---------- מחשבון ----------
  const hasRates = () => typeof RATES !== "undefined" && RATES.length;
  const countryLabel = r => `${r[0]} (${r[1]})`;
  function calcHtml() {
    if (!hasRates()) return `<div class="callout bad">טבלת התעריפים לא נטענה. כדאי לבדוק שהקובץ rates.js נמצא באתר.</div>`;
    const expired = typeof RATES_VALID_TO !== "undefined" && parse(RATES_VALID_TO) < today();
    return `<section class="panel" data-calc>
      <div class="form-grid">
        <label class="field">מדינת יעד<input list="countries" data-c="country" placeholder="למשל: ארצות הברית"></label>
        <label class="field">עיר<select data-c="city" disabled><option>בוחרים קודם מדינה</option></select></label>
        <label class="field">תאריך התחלה<input type="date" data-c="from"></label>
        <label class="field">תאריך סיום<input type="date" data-c="to"></label>
      </div>
      <div class="calc-out" data-c="out"></div>
      <p class="fine">החישוב לפי ${esc(typeof RATES_SOURCE !== "undefined" ? RATES_SOURCE : "טבלת התעריפים")}. ימים נספרים כימים קלנדריים מיום ההתחלה עד יום הסיום כולל, ולילות כמספר הלילות ביניהם. זו הערכה בלבד; הזכאות הסופית נקבעת לפי הוראת תכ"ם 13.10.2, כולל הכללים לימי יציאה וחזרה ולחופשה פרטית.</p>
      ${expired ? `<div class="callout warn" style="margin-top:12px">שימו לב: הטבלה בתוקף עד ${fmt(RATES_VALID_TO)}. ייתכן שפורסמה מהדורה חדשה עם תעריפים מעודכנים.</div>` : ""}
    </section>`;
  }
  function runCalc(box) {
    const q = s => box.querySelector(`[data-c="${s}"]`);
    const typed = q("country").value.trim();
    const rows = RATES.filter(r => countryLabel(r) === typed || r[0] === typed || r[1].toLowerCase() === typed.toLowerCase());
    const citySel = q("city"), prev = citySel.value;
    if (rows.length) {
      const cities = [...new Set(rows.map(r => r[2]))];
      citySel.innerHTML = cities.map(c => `<option ${c === prev ? "selected" : ""}>${esc(c)}</option>`).join("");

    } else { citySel.innerHTML = `<option>${typed ? "יעד שלא בטבלה" : "בוחרים קודם מדינה"}</option>`; citySel.disabled = true; }

    if (to < from) { out.innerHTML = `<div class="callout bad">תאריך הסיום לפני תאריך ההתחלה.</div>`; return; }

      return;
    }

    out.innerHTML = `

  function setupSigs(root) {

      const ctx = c.getContext("2d"); ctx.scale(ratio, ratio); ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#1a2a6c";
      let drawing = false;
      const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      c.addEventListener("pointerdown", e => { drawing = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
      c.addEventListener("pointermove", e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); c.dataset.signed = "1"; });

      const pn = 3 + i * 3, cn = pn + 1, im = pn + 2;
      const b64 = pg.c.toDataURL("image/jpeg", 0.85).split(",")[1], bin = atob(b64), jpg = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) jpg[k] = bin.charCodeAt(k);
      const content = `q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
      obj(pn, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${cn} 0 R >>`));
      obj(cn, () => { push(`<< /Length ${content.length} >>\nstream\n`); push(content); push("\nendstream"); });
      obj(im, () => { push(`<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push("\nendstream"); });
      pg.c.remove();
    });
    const xref = len, total = 3 + n * 3;
    push(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for (let k = 1; k < total; k++) push(String(offsets[k]).padStart(10, "0") + " 00000 n \n");
    push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts, { type: "application/pdf" });
  }
  function makePdf(kind, form) {
    const blob = pagesToPdf(kind === "advance" ? drawAdvance(form) : drawSettle(form));
    const name = `${kind === "advance" ? "מקדמה" : "התחשבנות"} - ${val(form, "name") || "טופס"}.pdf`;
    return new File([blob], name, { type: "application/pdf" });
  }

  // ---------- שמירת טיוטה במכשיר (localStorage) ----------
  const DRAFT_KEY = "draft-v1:";
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const IS_ANDROID = /Android/i.test(navigator.userAgent);
  const saveTimers = {};
  function scheduleSave(form) {
    if (!form) return;
    const kind = form.dataset.form;
    clearTimeout(saveTimers[kind]);
    saveTimers[kind] = setTimeout(() => saveDraft(form), 400);
  }
  function saveDraft(form) {
    const kind = form.dataset.form, d = { f: {}, r: {}, sig: {}, rows: {}, a: {} };
    form.querySelectorAll("[data-f]").forEach(el => { d.f[el.dataset.f] = el.value; if (el.dataset.auto) d.f["__auto_" + el.dataset.f] = 1; });
    form.querySelectorAll('input[type="radio"]:checked').forEach(el => d.r[el.name] = el.value);
    form.querySelectorAll("canvas.sig").forEach(c => { if (c.dataset.signed) d.sig[c.dataset.sig] = c.toDataURL("image/png"); });
    form.querySelectorAll("tbody[data-group]").forEach(tb => {
      d.rows[tb.dataset.group] = [...tb.rows].map(tr => ({
        date: tr.querySelector('[data-c="date"]').value, amount: tr.querySelector('[data-c="amount"]').value,
        meals: [...tr.querySelectorAll("[data-m]")].filter(x => x.checked).map(x => x.dataset.m),
        counts: Object.fromEntries([...tr.querySelectorAll("[data-cnt]")].map(x => [x.dataset.cnt, x.value]))
      }));
    });
    const actions = document.querySelector(`[data-actions="${kind}"]`);
    if (actions) actions.querySelectorAll("[data-a]").forEach(el => d.a[el.dataset.a] = el.checked);
    try { localStorage.setItem(DRAFT_KEY + kind, JSON.stringify(d)); } catch (_) {}
  }
  function restoreDraft(form) {
    const kind = form.dataset.form;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY + kind) || "null"); } catch (_) {}
    if (!d) return;
    Object.entries(d.rows || {}).forEach(([key, rows]) => {
      const tb = form.querySelector(`tbody[data-group="${key}"]`), r = SETTLE_ROWS.find(x => x.key === key);
      if (!tb || !r) return;
      while (tb.rows.length < rows.length) tb.insertAdjacentHTML("beforeend", entryRow(r, false));
      rows.forEach((x, i) => {
        const tr = tb.rows[i];
        tr.querySelector('[data-c="date"]').value = x.date || "";
        tr.querySelector('[data-c="amount"]').value = x.amount || "";
        tr.querySelectorAll("[data-m]").forEach(m => m.checked = (x.meals || []).includes(m.dataset.m));
        tr.querySelectorAll("[data-cnt]").forEach(c => { if (x.counts && x.counts[c.dataset.cnt]) c.value = x.counts[c.dataset.cnt]; c.hidden = !tr.querySelector(`[data-m="${c.dataset.cnt}"]`).checked; });
      });
    });
    fixRowspans(form);
    Object.entries(d.f || {}).forEach(([k, v]) => {
      if (k.startsWith("__auto_")) return;
      const el = form.querySelector(`[data-f="${k}"]`);
      if (el) { el.value = v; if (d.f["__auto_" + k]) el.dataset.auto = "1"; }
    });
    Object.entries(d.r || {}).forEach(([name, v]) => { const el = [...form.querySelectorAll(`input[name="${name}"]`)].find(x => x.value === v); if (el) el.checked = true; });
    Object.entries(d.sig || {}).forEach(([name, url]) => {
      const c = form.querySelector(`[data-sig="${name}"]`); if (!c) return;
      const img = new Image();
      img.onload = () => { const ctx = c.getContext("2d"); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(img, 0, 0, c.width, c.height); ctx.restore(); c.dataset.signed = "1"; };
      img.src = url;
    });
    const actions = document.querySelector(`[data-actions="${kind}"]`);
    if (actions) Object.entries(d.a || {}).forEach(([k, v]) => { const el = actions.querySelector(`[data-a="${k}"]`); if (el) el.checked = v; });
    if (kind === "settle") refreshSettle(form);
    const saved = actions && actions.querySelector("[data-saved]");
    if (saved) saved.textContent = "המשכת מאיפה שעצרת. הטופס נשמר במכשיר הזה בלבד.";
  }

  // העתקת פרטים שחוזרים על עצמם בטופס (שם ות"ז בחתימה ובייפוי הכוח)
  const MIRRORS = { name: ["signName", "poaMyName"], id: ["signId", "poaMyId"], rank: ["signRank"] };
  function mirror(box, src) {
    (MIRRORS[src.dataset.f] || []).forEach(t => {
      const el = box.querySelector(`[data-f="${t}"]`);
      if (el && (!el.value || el.dataset.auto === "1")) { el.value = src.value; el.dataset.auto = "1"; }
    });
  }

  // ---------- ניווט ----------
  function render() {
    const id = location.hash.replace("#", "");
    const d = DOCS.find(x => x.id === id);
    const app = document.getElementById("app");
    if (!d) { app.innerHTML = libraryHtml(); document.title = "מאגר מסמכים – נסיעות בתפקיד"; return; }
    const body = id === "calc" ? calcHtml() : id === "advance" ? advanceHtml() : settleHtml();
    app.innerHTML = docHead(d) + body;
    setupSigs(app);
    app.querySelectorAll("[data-form]").forEach(restoreDraft);
    document.title = d.title;
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", render);

  function copyLink(id, done) {
    const url = docUrl(id);
    const ok = () => { const el = document.querySelector(`[data-copied="${id}"]`); if (el) { el.textContent = "הקישור הועתק"; setTimeout(() => el.textContent = "", 2500); } };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, () => window.prompt("העתיקו את הקישור:", url));
    else window.prompt("העתיקו את הקישור:", url);
  }

  document.addEventListener("click", e => {
    const c = e.target.closest("[data-copy]");
    if (c) { copyLink(c.dataset.copy); return; }
    const s = e.target.closest("[data-share]");
    if (s) {
      const d = DOCS.find(x => x.id === s.dataset.share);
      window.open(`https://wa.me/?text=${encodeURIComponent(`${d.title}\n${docUrl(d.id)}`)}`, "_blank", "noopener");
      return;
    }
    const sc = e.target.closest("[data-sig-clear]");
    if (sc) { const c = document.querySelector(`[data-sig="${sc.dataset.sigClear}"]`); c.getContext("2d").clearRect(0, 0, c.width, c.height); delete c.dataset.signed; scheduleSave(c.closest("[data-form]")); return; }
    const al = e.target.closest("[data-addline]");
    if (al) {
      const r = SETTLE_ROWS.find(x => x.key === al.dataset.addline), tb = al.closest("tbody");
      tb.insertAdjacentHTML("beforeend", entryRow(r, false)); fixRowspans(tb.closest("[data-form]")); scheduleSave(tb.closest("[data-form]")); return;
    }
    const send = e.target.closest("[data-send]");
    if (send) {
      const kind = send.dataset.send, form = document.querySelector(`[data-form="${kind}"]`), box = send.closest("[data-actions]");
      if (!checkForm(kind, form, box, true)) return;
      const url = `https://wa.me/${waNumber()}?text=${encodeURIComponent(kind === "advance" ? advanceText(form) : settleText(form))}`;
      const w = window.open(url, "_blank");
      if (!w) location.href = url;
      say(box, "נפתח וואטסאפ. לא לשכוח לצרף את ה-PDF ואת המסמכים.", true);
      return;
    }
    const pr = e.target.closest("[data-print]");
    if (pr) {
      const kind = pr.dataset.print, form = document.querySelector(`[data-form="${kind}"]`), box = pr.closest("[data-actions]");
      if (!checkForm(kind, form, box, false)) return;
      if (!signed(form, "main") && !confirm("לא חתמת על הטופס. להמשיך בלי חתימה?")) return;
      saveDraft(form);
      let file;
      try { file = makePdf(kind, form); } catch (err) { need(box, "לא הצלחתי ליצור את קובץ ה-PDF במכשיר הזה. אפשר להשתמש ב\"הדפסה\" ולשמור כ-PDF."); return; }
      const tip = box.querySelector("[data-tip]");
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: file.name }).then(() => {
          tip.textContent = "הטופס נשלח. לא לשכוח לשלוח באותו צ'אט גם את שאר המסמכים.";
        }).catch(err => {
          if (err && err.name === "AbortError") return;
          downloadFile(file); tip.textContent = "הקובץ ירד למכשיר. פותחים וואטסאפ ומצרפים אותו.";
        });
        tip.textContent = "בחלון השיתוף בוחרים וואטסאפ, ואז את איש הקשר.";
      } else {
        downloadFile(file);
        tip.textContent = "קובץ ה-PDF ירד למחשב. נפתח וואטסאפ – מצרפים בצ'אט את הקובץ שירד.";
        const url = `https://wa.me/${waNumber()}?text=${encodeURIComponent(`${DOCS.find(x => x.id === kind).title} – ${val(form, "name")}. מצורף הטופס (PDF).`)}`;
        setTimeout(() => { const w = window.open(url, "_blank"); if (!w) location.href = url; }, 400);
      }
      return;
    }
    const pp = e.target.closest("[data-printpaper]");
    if (pp) { window.print(); return; }
    const cl = e.target.closest("[data-clear]");
    if (cl) {
      if (!confirm("למחוק את כל מה שמילאת בטופס הזה?")) return;
      try { localStorage.removeItem(DRAFT_KEY + cl.dataset.clear); } catch (_) {}
      render();
    }
  });
  function onField(e) {
    const act = e.target.closest("[data-actions]");
    if (act) { scheduleSave(document.querySelector(`[data-form="${act.dataset.actions}"]`)); return; }
    const calc = e.target.closest("[data-calc]"); if (calc) runCalc(calc);
    const form = e.target.closest("[data-form]");
    if (!form) return;
    if (e.target.dataset && e.target.dataset.f) { if (MIRRORS[e.target.dataset.f]) mirror(form, e.target); else delete e.target.dataset.auto; }
    if (e.target.dataset && e.target.dataset.m) {
      const c = e.target.closest("td").querySelector(`[data-cnt="${e.target.dataset.m}"]`);
      if (c) { c.hidden = !e.target.checked; if (e.target.checked && !c.value) c.value = 1; }
    }
    if (form.dataset.form === "settle") refreshSettle(form);
    scheduleSave(form);
  }
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);

  // טוענים את ההגדרות ואת טבלת התעריפים (תמיד בגרסה העדכנית), ואז מציגים
  function load(src) { return new Promise(r => { const s = document.createElement("script"); s.src = src + "?v=" + Date.now(); s.onload = s.onerror = r; document.body.appendChild(s); }); }
  Promise.all([load("data.js"), load("rates.js")]).then(() => {
    if (hasRates()) document.getElementById("countries").innerHTML = RATES.filter((r, j, a) => a.findIndex(x => x[1] === r[1]) === j).map(r => `<option value="${esc(countryLabel(r))}">`).join("");
    render();
  });
</script>
</body>
</html>
